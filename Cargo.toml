[package]
name = "axum-stack"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Axum server utilities — shutdown, CORS, request ID, health routes, middleware stack"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/axum-stack"
keywords = ["axum", "cors", "health"]
categories = ["web-programming"]
exclude = ["/target"]

[dependencies]
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "compression-gzip", "request-id", "timeout"] }
http = "1"
tokio = { version = "1", features = ["signal", "rt-multi-thread", "macros"] }
tracing = "0.1"
serde_json = "1"
healthkit = "1.0.1"
shutdown-kit = "0.2"
thiserror = "2"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[lints.rust]
unsafe_code = "forbid"

[[bench]]
name = "axum_stack_bench"
harness = false

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
